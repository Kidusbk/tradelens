version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: tradelens_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradelens
      POSTGRES_PASSWORD: tradelens_dev_password
      POSTGRES_DB: tradelens_dev
      POSTGRES_HOST_AUTH_METHOD: trust  # no password needed for local dev
    ports:
      - '5433:5432'                  # host 5433 → container 5432 (avoids conflict with local postgres)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tradelens -d tradelens_dev']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
