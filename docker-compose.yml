version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: tradelens_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradelens
      POSTGRES_PASSWORD: tradelens_dev_password
      POSTGRES_DB: tradelens_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tradelens -d tradelens_dev']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
